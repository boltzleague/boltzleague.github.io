<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ref Access | Boltz League</title>
  <link rel="canonical" href="https://boltzleague.github.io/">
  <link rel="icon" href="/assets/boltz.png">
  <meta name="robots" content="noindex">
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const match = query.get('match');
      const section = query.get('section');
      const route = '#ref' + (match ? '/' + encodeURIComponent(match) : '');
      const suffix = ['teams', 'fixtures', 'live', 'database'].includes(section)
        ? '?section=' + section : '';
      location.replace('/' + route + suffix);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Boltz League Ref Access</h1>
    <p><a href="/#ref">Open Ref Access in the Match Centre</a></p>
  </main>
</body>
</html>
