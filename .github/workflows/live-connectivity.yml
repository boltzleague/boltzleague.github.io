name: Boltz League live connectivity check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  connectivity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe GitHub Pages and live referee API without credentials
        run: node scripts/check-live-connectivity.mjs
      - name: Install headless browser test client
        run: npm install --no-save --no-audit --no-fund puppeteer-core@24.29.0
      - name: Exercise public pages and live feed in Chrome
        run: node scripts/check-browser.mjs
      - name: Exercise simulated referee-to-publication lifecycle
        run: node scripts/check-ref-simulated.mjs
      - uses: actions/checkout@v4
        with:
          repository: JohnBarsisa/boltz-league-admin
          path: .backend
      - name: Exercise actual gateway and worker with isolated SQLite in Chrome
        run: node scripts/check-ref-worker.mjs
      - name: Verify concurrent client merge behavior
        run: node scripts/check-ref-merge.mjs
      - name: Verify deployed backend commit against GitHub (read-only)
        run: node .backend/service/scripts/verify-production.mjs "$(git -C .backend rev-parse HEAD)"
